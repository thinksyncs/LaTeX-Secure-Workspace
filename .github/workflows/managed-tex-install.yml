name: Managed TeX installation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        profile: [lightweight, japanese]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - name: Install PDF structure checkers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y qpdf ghostscript
      - name: Install pinned TinyTeX and build the first PDF
        id: smoke
        run: node dev/testManagedTex.mjs ${{ matrix.profile }}
      - name: Reject PDF structure warnings
        if: runner.os == 'Linux'
        env:
          EVIDENCE: ${{ steps.smoke.outputs.evidence }}
        run: node dev/checkManagedTexPdf.mjs "$EVIDENCE"
      - name: Save PDF and verification evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: managed-tex-${{ matrix.os }}-${{ matrix.profile }}
          path: |
            ${{ steps.smoke.outputs.evidence }}/qa-report.json
            ${{ steps.smoke.outputs.evidence }}/project with spaces/.lw-security/t.pdf
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
