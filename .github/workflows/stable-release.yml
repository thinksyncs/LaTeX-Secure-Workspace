name: Stable Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable GitHub release tag to publish.
        required: true

permissions: read-all

concurrency:
  group: stable-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: marketplace
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      LATEXWORKSHOP_ALLOW_VSCODE_TEST_DOWNLOAD: '1'
      LATEXWORKSHOP_VSCODE_TEST_VERSION: '1.96.0'
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
        ref: ${{ env.RELEASE_TAG }}
    - uses: ./.github/actions/setup-texlive-linux
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: '20'
        cache: npm
    - name: Validate tag matches package version
      run: |
        package_version="$(node -p "require('./package.json').version")"
        normalized_tag="${RELEASE_TAG#v}"
        if [ "$normalized_tag" != "$package_version" ]; then
          echo "Release tag $RELEASE_TAG does not match package.json version $package_version" >&2
          exit 1
        fi
    - name: Validate stable release stays on current major line
      run: |
        normalized_tag="${RELEASE_TAG#v}"
        previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$RELEASE_TAG" | head -n1)"
        if [ -z "$previous_tag" ]; then
          previous_tag="$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | grep -Fxv "$normalized_tag" | head -n1)"
        fi
        if [ -z "$previous_tag" ]; then
          echo "No previous stable tag found; skipping major-line validation."
          exit 0
        fi

        previous_version="${previous_tag#v}"
        previous_major="${previous_version%%.*}"
        current_major="${normalized_tag%%.*}"
        if [ "$current_major" != "$previous_major" ]; then
          echo "Stable releases must update minor or patch versions without changing the major version." >&2
          echo "Previous stable tag: $previous_tag" >&2
          echo "Current release tag: $RELEASE_TAG" >&2
          exit 1
        fi
    - name: Install dependencies
      run: npm ci --ignore-scripts
    - name: Verify release build
      run: xvfb-run -a npm run release:verify
    - name: Package VSIX
      id: package
      run: |
        package_name="$(node -p "require('./package.json').name")"
        package_version="$(node -p "require('./package.json').version")"
        mkdir -p "$RUNNER_TEMP/vsix"
        vsix_path="$RUNNER_TEMP/vsix/${package_name}-${package_version}.vsix"
        npx vsce package --out "$vsix_path"
        echo "vsix_path=$vsix_path" >> "$GITHUB_OUTPUT"
    - name: Audit VSIX payload
      run: |
        entries="$(unzip -Z1 "${{ steps.package.outputs.vsix_path }}")"
        ! grep -q '^extension/node_modules/' <<< "$entries" || { echo "VSIX must not contain node_modules."; exit 1; }
        for required in \
          extension/out/extension.js \
          extension/out/unified.js \
          extension/out/src/parse/parser/unified.js \
          extension/out/src/preview/mathjax/mathjax.js \
          extension/out/pdfjs/build/pdf.mjs \
          extension/out/pdfjs/build/pdf.worker.mjs \
          extension/out/pdfjs/cmaps/ \
          extension/out/pdfjs/standard_fonts/ \
          extension/out/pdfjs/wasm/ \
          extension/out/pdfjs/LICENSE
        do
          grep -q "^${required}" <<< "$entries" || { echo "VSIX is missing ${required}."; exit 1; }
        done
        echo "VSIX payload contains $(wc -l <<< "$entries") entries."
    - name: Generate SPDX SBOM
      id: sbom
      run: |
        sbom_path="${{ steps.package.outputs.vsix_path }}"
        sbom_path="${sbom_path%.vsix}.spdx.json"
        npm sbom --omit=dev --omit=optional --sbom-format spdx > "$sbom_path"
        node -e 'const fs = require("fs"); const sbom = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (sbom.spdxVersion !== "SPDX-2.3" || !Array.isArray(sbom.packages) || sbom.packages.length === 0) process.exit(1)' "$sbom_path"
        echo "sbom_path=$sbom_path" >> "$GITHUB_OUTPUT"
    - name: Attest VSIX build provenance
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      with:
        subject-path: ${{ steps.package.outputs.vsix_path }}
    - name: Attest VSIX SBOM
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      with:
        subject-path: ${{ steps.package.outputs.vsix_path }}
        sbom-path: ${{ steps.sbom.outputs.sbom_path }}
    - name: Publish stable extension to Marketplace
      uses: ./.github/actions/publish-extension
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      with:
        vsix_path: ${{ steps.package.outputs.vsix_path }}
        publish_openvsx: 'false'
    - name: Upload VSIX to GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.vsix_path }}" "${{ steps.sbom.outputs.sbom_path }}" --clobber
    - name: Archive VSIX artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: stable-vsix
        path: |
          ${{ steps.package.outputs.vsix_path }}
          ${{ steps.sbom.outputs.sbom_path }}
